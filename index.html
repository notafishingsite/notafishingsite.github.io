<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fischis</title>

    <style>
        @font-face {
            font-family: Letters;
            src: url("Letters2.otf");
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .body {
            background: #0011c7;
            background: linear-gradient(0deg,rgb(4, 14, 119) 0%, rgba(62, 108, 247, 1) 49%, rgba(105, 175, 255, 1) 100%);
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        marquee {
            font-family: Letters;
            font-size: 4rem;
            color: #ffffff;
            position: relative;
            z-index: 2;
            text-shadow:
                0 0 5px #ffffff,
                0 0 10px #ffffff,
                0 0 20px rgb(0, 251, 255),
                0 0 40px rgb(227, 181, 255);
        }

        .fish {
            position: absolute;
            left: 0;
            height: auto;
            transform-origin: center;
            pointer-events: none;
        }

        @media (max-width: 600px) {
    .fish {
        width: 40% !important;
    }
}
    </style>
</head>

<body>
    <div class="body" id="aquarium">
        <marquee>
            YOU HAVE BEEN FISHED HEHEHEHEHEHEHE
        </marquee>
    </div>

    <script>
        const aquarium = document.getElementById("aquarium");

        const fishData = [
            { src: "fish1.png", size: 200, top: "15%", speed: 100 },
            { src: "fish2.png", size: 220, top: "25%", speed: 150 },
            { src: "fish3.png", size: 190, top: "38%", speed: 90 },
            { src: "fish10.png", size: 180, top: "55%", speed: 160 },
            { src: "fish4.png", size: 200, top: "40%", speed: 150 },
            { src: "fish5.png", size: 220, top: "67%", speed: 110 },
            { src: "fish6.png", size: 190, top: "77%", speed: 100 },
            { src: "fish7.png", size: 150, top: "85%", speed: 100 },
            { src: "fish8.png", size: 190, top: "80%", speed: 130 },
            { src: "fish9.png", size: 200, top: "44%", speed: 90 },
            { src: "fish11.png", size: 190, top: "67%", speed: 110 },
            { src: "fish12.png", size: 194, top: "28%", speed: 70 },
            { src: "fish13.png", size: 200, top: "14%", speed: 110 }
        ];

        const fishes = fishData.map(data => {
            const img = document.createElement("img");

            img.src = data.src;
            img.className = "fish";
            img.style.width = data.size + "px";
            img.style.top = data.top;

            aquarium.appendChild(img);

            return {
                element: img,
                x: Math.random() * Math.max(0, aquarium.clientWidth - data.size),
                speed: data.speed,
                direction: Math.random() > 0.5 ? 1 : -1,
                phase: Math.random() * Math.PI * 2
            };
        });

        let lastTime = null;

        function animate(time) {
            const dt = lastTime === null
                ? 0
                : Math.min((time - lastTime) / 1000, 0.05);

            lastTime = time;

           
    fishes.forEach(fish => {
        const maxX = Math.max(
            0,
            aquarium.clientWidth - fish.element.offsetWidth
        );

        fish.x += fish.speed * fish.direction * dt;

        if (fish.x >= maxX) {
            fish.x = maxX;
            fish.direction = -1;
        }

        if (fish.x <= 0) {
            fish.x = 0;
            fish.direction = 1;
        }

        const beepboop = Math.sin(time / 600 + fish.phase) * 8;

        fish.element.style.transform =
            `translate(${fish.x}px, ${beepboop}px) scaleX(${fish.direction})`;
    });
        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    </script>
</body>
</html>
